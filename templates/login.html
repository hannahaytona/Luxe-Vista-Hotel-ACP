{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Please login to your account</p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group" style="position: relative;">
                <label>Password</label>
                <input type="password" name="password" id="loginPass" class="form-control" required>
                <i class="fas fa-eye" id="toggleLoginPass" style="position: absolute; right: 15px; top: 40px; cursor: pointer; color: var(--muted);" onclick="togglePass('loginPass', 'toggleLoginPass')"></i>
            </div>
            <button type="submit" class="btn btn-primary auth-btn">Login</button>
        </form>
        
        <div class="auth-links">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </div>
</div>

<script>
function togglePass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
