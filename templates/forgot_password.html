{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
<div class="auth-card">
    <div class="auth-header">
        <h2>Reset Password</h2>
        <p>Enter your email to receive a reset link</p>
    </div>
    <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary auth-btn">Send Reset Link</button>
    </form>
    <div class="auth-links">
        <p>Remembered your password? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
</div>
{% endblock %}
